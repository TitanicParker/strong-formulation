<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Boundary-test staircase</title><desc id="desc">Later events from 2017 to 2025 repeatedly bear on the unresolved feet and neurological relationship.</desc><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-family:Georgia,serif;font-weight:bold;font-size:28px}.year{font-weight:bold;font-size:18px}.label{font-size:16px}.step{fill:#fff;stroke:#7f878c;stroke-width:2}.line{stroke:#334c5c;stroke-width:4;fill:none}</style><text x="40" y="45" class="h">Repeated tests of the same unresolved boundary</text><path d="M90 465H260V395H430V325H600V255H770V185H940V115H1040" class="line"/><rect x="90" y="425" width="170" height="80" class="step"/><text x="110" y="455" class="year">2017</text><text x="110" y="482" class="label">Procyclidine withdrawal</text><rect x="260" y="355" width="170" height="80" class="step"/><text x="280" y="385" class="year">2019</text><text x="280" y="412" class="label">GP reconnects feet/tone/gait</text><rect x="430" y="285" width="170" height="80" class="step"/><text x="450" y="315" class="year">2023</text><text x="450" y="342" class="label">Severe bilateral foot pain</text><rect x="600" y="215" width="170" height="80" class="step"/><text x="620" y="245" class="year">2023</text><text x="620" y="272" class="label">Pain + shuffling OFF-related</text><rect x="770" y="145" width="170" height="80" class="step"/><text x="790" y="175" class="year">2025</text><text x="790" y="202" class="label">Sinemet improves feet</text><rect x="940" y="75" width="120" height="80" class="step"/><text x="960" y="105" class="year">2025</text><text x="960" y="132" class="label">CR: profound relief</text></svg>
