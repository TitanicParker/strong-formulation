<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">The missing decision fork</title><desc id="desc">Actual history includes Not clear, Protest, decision to continue, and plan. Portable documentary history includes Not clear, markedly divorced, Podiatry, understanding, and clear plan.</desc><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-family:Georgia,serif;font-weight:bold;font-size:28px}.n{font-size:19px}.small{font-size:15px;fill:#5c6670}.box{fill:#fff;stroke:#9aa1a6;stroke-width:2}.fork{fill:#ece8df;stroke:#6c5b43;stroke-width:3}.line{stroke:#334c5c;stroke-width:3;fill:none}.dash{stroke:#6c5b43;stroke-width:3;stroke-dasharray:10 8;fill:none}</style><text x="40" y="50" class="h">ACTUAL DECISION HISTORY</text><rect x="40" y="85" width="190" height="75" class="box"/><text x="135" y="130" text-anchor="middle" class="n">Not clear</text><path d="M230 122H315" class="line"/><rect x="315" y="85" width="190" height="75" class="fork"/><text x="410" y="118" text-anchor="middle" class="n">Protest</text><text x="410" y="142" text-anchor="middle" class="small">known contest</text><path d="M505 122H590" class="line"/><rect x="590" y="85" width="240" height="75" class="box"/><text x="710" y="118" text-anchor="middle" class="n">Decision to continue</text><text x="710" y="142" text-anchor="middle" class="small">fork not preserved</text><path d="M830 122H915" class="line"/><rect x="915" y="85" width="210" height="75" class="box"/><text x="1020" y="130" text-anchor="middle" class="n">Plan</text><text x="40" y="270" class="h">PORTABLE DOCUMENTARY HISTORY</text><rect x="40" y="305" width="190" height="75" class="box"/><text x="135" y="350" text-anchor="middle" class="n">Not clear</text><path d="M230 342H300" class="line"/><rect x="300" y="305" width="210" height="75" class="box"/><text x="405" y="338" text-anchor="middle" class="n">“markedly divorced”</text><text x="405" y="362" text-anchor="middle" class="small">attributed patient state</text><path d="M510 342H575" class="line"/><rect x="575" y="305" width="150" height="75" class="box"/><text x="650" y="350" text-anchor="middle" class="n">Podiatry</text><path d="M725 342H790" class="line"/><rect x="790" y="305" width="160" height="75" class="box"/><text x="870" y="338" text-anchor="middle" class="n">Understanding</text><text x="870" y="362" text-anchor="middle" class="small">counselled</text><path d="M950 342H1010" class="line"/><rect x="1010" y="305" width="150" height="75" class="box"/><text x="1085" y="350" text-anchor="middle" class="n">Clear plan</text><path d="M410 160V270" class="dash"/><text x="430" y="222" class="small">missing from portable account</text><text x="40" y="465" class="h">The selected branch survived. The fork did not.</text></svg>
