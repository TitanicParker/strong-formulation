<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">The 2025 documentary loop</title><desc id="desc">Founding record leads to inherited framework, later continuity, historical challenge, and the founding record plus descendants being offered as proof.</desc><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-family:Georgia,serif;font-weight:bold;font-size:28px}.n{font-size:18px}.box{fill:#fff;stroke:#7f878c;stroke-width:2}.line{stroke:#334c5c;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334c5c"/></marker></defs><text x="40" y="45" class="h">record → inheritance → challenge → record offered as answer</text><rect x="70" y="110" width="210" height="75" class="box"/><text x="175" y="155" text-anchor="middle" class="n">Founding record</text><rect x="390" y="110" width="210" height="75" class="box"/><text x="495" y="155" text-anchor="middle" class="n">Inherited framework</text><rect x="710" y="110" width="210" height="75" class="box"/><text x="815" y="155" text-anchor="middle" class="n">Later continuity</text><rect x="710" y="325" width="210" height="75" class="box"/><text x="815" y="370" text-anchor="middle" class="n">Historical challenge</text><rect x="230" y="325" width="330" height="75" class="box"/><text x="395" y="358" text-anchor="middle" class="n">Founding record + descendants</text><text x="395" y="382" text-anchor="middle" class="n">offered as proof</text><path d="M280 148H390" class="line"/><path d="M600 148H710" class="line"/><path d="M815 185V325" class="line"/><path d="M710 362H560" class="line"/><path d="M230 362H140V185" class="line"/></svg>
