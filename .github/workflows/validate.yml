name: Validate evidence repository

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evidence, links and privacy layer
        run: python scripts/validate.py
      - name: Build static site
        run: python scripts/build_site.py
